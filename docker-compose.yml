services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: edupilot_postgres
    environment:
      POSTGRES_USER: edupilot
      POSTGRES_PASSWORD: edupilot_pass
      POSTGRES_DB: edupilot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupilot -d edupilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: edupilot_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://edupilot:edupilot_pass@postgres:5432/edupilot_db
      DATABASE_SYNC_URL: postgresql://edupilot:edupilot_pass@postgres:5432/edupilot_db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_TEMPERATURE: "0.7"
      OLLAMA_MAX_TOKENS: "1024"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-3.5-flash-lite
      LLM_PROVIDER: gemini
      SECRET_KEY: change-this-in-production-use-long-random-string
      APP_ENV: development
      DEBUG: "false"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - reports_data:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: edupilot_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  reports_data:

networks:
  default:
    name: edupilot_network



